<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consent Lab</title><style>body{font-family:system-ui;background:#111827;color:#f9fafb;display:grid;place-items:center;min-height:100vh;margin:0}.card{width:min(92%,560px);background:#1f2937;border:1px solid #374151;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0008}button{border:0;border-radius:14px;padding:14px 18px;font-weight:700;cursor:pointer;margin:6px}.primary{background:#f472b6;color:#111827}.secondary{background:#374151;color:#fff}.mono{font-family:monospace;background:#111827;padding:12px;border-radius:12px;white-space:pre-wrap}#status{margin-top:16px}</style></head><body><main class="card"><h1>Authorized Cybersecurity Lab</h1><p>This client sends <b>synthetic</b> call-log records to your private lab receiver. No real phone history is accessed.</p><button class="primary" id="send">Generate &amp; Send Test Records</button><button class="secondary" id="clear">Clear</button><div id="status"></div></main><script>const receiver='http://10.119.176.166:8080/upload';const status=document.querySelector('#status');function records(){const now=Date.now();return[{number:'024 XXX 1010',type:'INCOMING',date:now-3600000,durationSeconds:42},{number:'055 XXX 2020',type:'OUTGOING',date:now-7200000,durationSeconds:118},{number:'020 XXX 3030',type:'MISSED',date:now-10800000,durationSeconds:0}]}document.querySelector('#send').onclick=async()=>{const payload={synthetic:true,device:'Lab Browser',records:records()};status.innerHTML='<div class="mono">Sending test payload…</div>';try{const r=await fetch(receiver,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();status.innerHTML='<div class="mono">Success: '+JSON.stringify(j,null,2)+'</div>'}catch(e){status.innerHTML='<div class="mono">Connection failed. Confirm Phone A is running the receiver and both devices are on the same network.\n'+e.message+'</div>'}};document.querySelector('#clear').onclick=()=>status.textContent='';</script></body></html>
